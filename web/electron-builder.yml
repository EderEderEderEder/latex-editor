appId: com.example.latexeditor.web
productName: LatexEditor Web
directories:
  output: dist
files:
  - out/**
  - package.json
  # Test-Preload (Playwright, LATEXEDITOR_STUB_PRELOAD): gehört nicht ins Paket.
  - "!out/preload/stub*"
# Keine nativen Module: spart den Rebuild-Schritt (S6).
npmRebuild: false
win:
  target:
    - target: nsis
      arch: x64
  # Kein Administratorrecht: Installer und App laufen als aufrufender Benutzer.
  requestedExecutionLevel: asInvoker
nsis:
  # Assistent mit Ordnerwahl statt Ein-Klick-Installer; Installation je Benutzer unter %LOCALAPPDATA%.
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  artifactName: "${productName}-Setup-${version}.${ext}"
# Dateizuordnungen sind nicht nötig und bewusst nicht gesetzt (keine fileAssociations).
mac:
  target: dmg
  category: public.app-category.productivity
linux:
  target: AppImage
  category: Office
