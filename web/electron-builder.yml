appId: com.example.latexeditor.web
productName: LatexEditor Web
directories:
  output: dist
files:
  - out/**
  - package.json
  # Test-Preload (Playwright, LATEXEDITOR_STUB_PRELOAD): gehört nicht ins Paket.
  - "!out/preload/stub*"
# Rechtschreibung (W7-2): Die Wörterbuchdaten (`dictionary-de-at`, igerman98, GPL-2.0 OR GPL-3.0) liegen als eigene
# Dateien in `out/renderer/assets/` (`index-*.aff`, `index-*.dic`) und kommen über `out/**` ins Paket. Der Lizenztext
# liegt sichtbar daneben unter `resources/licenses/`.
extraResources:
  - from: node_modules/dictionary-de-at/license
    to: licenses/dictionary-de-at-LICENSE.txt
# Kein asarUnpack für die Worker (`out/main/parse.worker.js`, `synctex.worker.js`): `worker_threads` lädt sie samt
# `out/main/chunks/` direkt aus `app.asar` (W2-INT, mit dem Programm aus `electron-builder --dir` geprüft).
# Keine nativen Module: spart den Rebuild-Schritt (S6).
npmRebuild: false
win:
  target:
    - target: nsis
      arch: x64
  # Kein Administratorrecht: Installer und App laufen als aufrufender Benutzer.
  requestedExecutionLevel: asInvoker
nsis:
  # Assistent mit Ordnerwahl statt Ein-Klick-Installer; Installation je Benutzer unter %LOCALAPPDATA%.
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  artifactName: "${productName}-Setup-${version}.${ext}"
# Dateizuordnungen sind nicht nötig und bewusst nicht gesetzt (keine fileAssociations).
mac:
  target: dmg
  category: public.app-category.productivity
linux:
  target: AppImage
  category: Office
